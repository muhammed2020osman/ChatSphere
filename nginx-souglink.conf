# Nginx configuration for souglink.com
# To apply: sudo cp nginx-souglink.conf /etc/nginx/sites-available/souglink.com
# sudo ln -sf /etc/nginx/sites-available/souglink.com /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name souglink.com www.souglink.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name souglink.com www.souglink.com;

    # SSL certificate paths (use Let's Encrypt)
    # To get certificate: sudo certbot --nginx -d souglink.com -d www.souglink.com
    ssl_certificate /etc/letsencrypt/live/souglink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/souglink.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to Express server on port 5000
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Cache bypass for upgrades
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files (optional - if serving static files directly)
    location /static {
        alias /www/wwwroot/souglink.com/dist/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

